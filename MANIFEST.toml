long_description = """Fetch lyrics for your tracks from LRCLIB, NetEase Cloud Music, Kugou, Kuwo and Lyrics.ovh.

Sources are queried one after another in the order you choose, and the first provider returning lyrics wins. Each source can be disabled, re-ordered and scored with a minimum match threshold.

Lyrics are written to the `lyrics` tag and, optionally, to a `.lrc` or `.txt` sidecar file next to the audio file.

Translations from a source can be merged into a bilingual `.lrc`, an option that is off by default.

Scraping can run when a track is loaded, when a file is saved, or on demand from the track and album context menus. A manual mode lets you pick between the ranked search results before anything is written."""
